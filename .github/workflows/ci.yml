name: CI

on:
  push:
  pull_request:
  # Task 12: the perf-guard job below (large-fixture UI-thread responsiveness
  # e2e check) is deliberately NOT on this push/pull_request trigger — see
  # its own job comment for why — so it needs its own way to run: a weekly
  # schedule (catches a slow regression eventually, without slowing down
  # every push) plus workflow_dispatch (an on-demand manual run from the
  # Actions tab, e.g. right before a release or after touching the import
  # pipeline).
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Runs on every push/PR (the schedule/workflow_dispatch triggers above
    # exist only to drive the separate `perf-guard` job below — this main
    # job still runs then too, which is harmless/cheap and keeps a
    # scheduled/manual run's normal test suite results visible as well).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          # fetch-depth: 0 (full history, all branches) is required by the
          # "Golden version gate" step below — it needs `git merge-base`
          # against either the previous commit (push) or the PR's target
          # branch (pull_request), which a shallow (depth-1) checkout
          # cannot provide. See scripts/check-golden-version-gate.ts's
          # module doc for the exact base-ref logic this enables.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Belt-and-suspenders: apps/server's own postinstall already runs
        # `prisma generate`, but the client is a generated artifact that
        # other workspaces' typecheck/test steps depend on, so don't rely
        # on npm's workspace postinstall ordering here.
        run: npx prisma generate --schema apps/server/prisma/schema.prisma

      - name: Golden version gate
        # CI-only merge-boundary check (scripts/check-golden-version-gate.ts):
        # fails the build if any golden-pinned file (test-fixtures/golden/
        # kernel-ops.json, test-fixtures/{intake,curvature,offset}/*.golden.json)
        # changed in this push/PR WITHOUT both a KERNEL_VERSION bump
        # (packages/kernel/src/index.ts) and a matching docs/CHANGELOG-kernel.md
        # entry. This is the layer that catches "regenerated golden file,
        # self-consistent, but no deliberate version bump" — a scenario the
        # golden regression suite's live-vs-committed hash comparison
        # (test/golden/kernel-ops.test.ts) cannot see, because a freshly
        # regenerated golden file matches itself. Runs BEFORE the golden
        # fixture tests below so a defeated-gate push fails fast, with an
        # actionable message, before spending time on the full suite.
        # No-ops (exit 0) on schedule/workflow_dispatch runs, which have no
        # single push/PR range to diff — see the script's module doc.
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npx tsx scripts/check-golden-version-gate.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Fuzz suite (packages/io parsers)
        # Separate vitest project/config (vitest.fuzz.config.ts), excluded
        # from `npm test` above — seeded, bounded run counts (see
        # packages/io/fuzz/*.fuzz.test.ts for the exact seeds/counts), so
        # this is fast and deterministic, not an open-ended fuzzer. Runs
        # after the main unit tests per this task's brief ("add
        # npm run test:fuzz (bounded run count) after unit tests").
        run: npm run test:fuzz

      - name: Golden fixture tests
        # Requires the real Git LFS content (checkout above uses lfs: true).
        # If LFS content didn't come down as real binaries, these tests fail
        # with an explicit "git lfs pull" message (test/golden/stl-reader.ts)
        # rather than a confusing parse error.
        #
        # Phase 2 Task 8: this single step also covers BOTH of that task's
        # CI mandates — the kernel-ops golden regression suite
        # (test/golden/kernel-ops.test.ts: pinned-param op hashes vs.
        # test-fixtures/golden/kernel-ops.json, KERNEL_VERSION-gated
        # enforcement per docs/CHANGELOG-kernel.md) and the journal-replay
        # harness (test/golden/journal-replay.test.ts: PLAN §6.3 "CI replays
        # fixture journals on every commit", fast fixture subset) — both
        # live in the same `golden` vitest project this step already runs,
        # so no separate workflow steps are needed.
        #
        # Runtime-split fix-batch note: this step no longer runs
        # test/golden/offset.test.ts's expensive clinical-pitch
        # (DEFAULT_OFFSET_VOXEL_PITCH_MM = 0.02 mm, ~117-118 s) die golden —
        # that test self-skips here (`it.skipIf`, RUN_CLINICAL_GOLDEN unset)
        # and instead runs in the `perf-guard` job below. A fast coarse-pitch
        # pin of the SAME fixture (scripts/kernel-ops-lib.ts's `offsetMesh`
        # entry, ~2 s) stays in this step's default `golden` project run.
        #
        # Task 12 note: test/manual/*.ts (real-scan pipeline replication
        # scripts, committed per Task 12's review carry-over — see
        # test/manual/README.md) are excluded from every Vitest project's
        # `include` glob in vitest.config.ts/vitest.fuzz.config.ts (they
        # don't even have a `.test.ts` suffix) — verified they do NOT run as
        # part of `npm test`/`npm run test:golden`/`npm run test:fuzz`
        # above; they're still typechecked by the "Typecheck" step (root
        # tsconfig.json's `include` covers `test/`).
        run: npm run test:golden

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (smoke + phase1)
        # playwright.config.ts's webServer boots `npm run dev` (client +
        # server) itself, including the server's own DB migration step
        # (apps/server/package.json's predev/dev scripts) — no separate
        # migrate step needed here. `playwright test` (no args, `testDir:
        # './e2e'`) runs every spec under e2e/: smoke.spec.ts (Phase 0) AND
        # phase1.spec.ts (Task 12's import->intake->view->measure->section->
        # save->reload acceptance walkthrough — see that file's module doc).
        # e2e/perf.spec.ts ALSO lives under e2e/ and is picked up by this
        # same command, but self-skips (`test.skip(!RUN_PERF_E2E, ...)`)
        # since RUN_PERF_E2E isn't set here — it shows as "skipped" in this
        # job's output, never runs its ~120 MB fixture here. See the
        # separate `perf-guard` job below for where it actually runs.
        run: npm run test:e2e

      - name: Upload Playwright report and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  perf-guard:
    # Task 12: e2e/perf.spec.ts asserts the UI thread stays responsive (a
    # requestAnimationFrame heartbeat's max gap) while streaming a real
    # ~120 MB generated fixture through the full import pipeline — see that
    # file's module doc for the measurement method and the 50 ms target /
    # 80 ms CI-gate distinction (tightened from 100 ms by Phase 2 Task 1's
    # worker-side hashing fix — see docs/demos/phase-1.md's "Update — Phase
    # 2 Task 1 re-measurement" note).
    #
    # NOT run on every push/PR: generating the fixture + reading/hashing/
    # parsing/welding ~2.5M triangles through real worker jobs takes on the
    # order of a minute even though it correctly never blocks the UI thread
    # (that's the whole point being measured) — several times slower than
    # every other CI step combined, for a check whose failure mode (an
    # accidental main-thread block creeping into the import pipeline) is a
    # slow-moving regression, not something that needs catching within
    # seconds of the commit that caused it. Runs weekly (schedule, see the
    # workflow-level `on:` trigger above) plus on-demand
    # (workflow_dispatch) instead.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          # lfs: true — the perf e2e fixture itself is generated on demand
          # (scripts/generate-large-fixture.ts), not stored in LFS, but this
          # job ALSO runs the clinical-pitch offset golden below
          # (RUN_CLINICAL_GOLDEN=1), which needs the real (LFS-backed)
          # test-fixtures/standin-scans/standin-prep-die.stl content, not a
          # pointer file.
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/server/prisma/schema.prisma

      - name: Clinical-pitch offset golden (RUN_CLINICAL_GOLDEN)
        # test/golden/offset.test.ts's die-at-DEFAULT_OFFSET_VOXEL_PITCH_MM
        # (0.02 mm) golden — ~117-118 s, moved off the every-push golden
        # suite (see that file's module doc "Runtime split") onto this
        # weekly/on-demand job, same rationale as the e2e perf-guard check
        # below: a slow-moving regression, not something that needs
        # catching within seconds of the causing commit. The default
        # `npm run test:golden` suite still pins the SAME fixture at a
        # coarse pitch (scripts/kernel-ops-lib.ts's `offsetMesh` entry) on
        # every push/PR.
        env:
          RUN_CLINICAL_GOLDEN: '1'
        run: npx vitest run --project golden test/golden/offset.test.ts

      - name: Generate the ~120 MB perf fixture
        run: npm run fixtures:generate-large

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Perf guard e2e
        env:
          RUN_PERF_E2E: '1'
        run: npx playwright test e2e/perf.spec.ts

      - name: Upload Playwright report and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-perf-guard
          path: |
            playwright-report/
            test-results/
          retention-days: 7
